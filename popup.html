<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tab Limiter</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 320px;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .header {
      background: rgba(255, 255, 255, 0.95);
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid rgba(102, 126, 234, 0.2);
    }

    .header h1 {
      font-size: 20px;
      margin: 0 0 8px 0;
      color: #111827;
    }

    .header p {
      margin: 0;
      font-size: 13px;
      color: #6b7280;
    }

    .quick-stats {
      background: white;
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat-box {
      text-align: center;
      padding: 12px;
      background: #f9fafb;
      border-radius: 8px;
      border: 2px solid #e5e7eb;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 11px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .actions {
      background: white;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
    }

    .btn-secondary:hover {
      background: #e5e7eb;
    }

    .footer {
      background: rgba(255, 255, 255, 0.95);
      padding: 12px;
      text-align: center;
      font-size: 11px;
      color: #6b7280;
      border-top: 2px solid rgba(102, 126, 234, 0.2);
    }

    .footer a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
<div class="header">
  <h1>⚡ Tab Limiter</h1>
  <p>Stay focused, stay productive</p>
</div>

<div class="quick-stats">
  <div class="stat-box">
    <div class="stat-value" id="quickDefaultLimit">10</div>
    <div class="stat-label">Default</div>
  </div>
  <div class="stat-box">
    <div class="stat-value" id="quickCustomDomains">0</div>
    <div class="stat-label">Domains</div>
  </div>
  <div class="stat-box">
    <div class="stat-value" id="quickBlockedUrls">0</div>
    <div class="stat-label">Blocked</div>
  </div>
</div>

<div class="actions">
  <button class="btn btn-primary" id="openSettings">
    ⚙️ Open Settings
  </button>
  <button class="btn btn-secondary" id="quickToggle">
    <span id="toggleIcon">🔴</span>
    <span id="toggleText">Extension Disabled</span>
  </button>
</div>

<div class="footer">
  by <a href="https://sulton.dev/" target="_blank">sultondev</a> © 2025
</div>

<script src="popup-quick.js"></script>
</body>
</html>
