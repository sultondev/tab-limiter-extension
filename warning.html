<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
    <title>Tab Limit Warning</title>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

    body {
    font-family: system-ui, -apple-system, sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(10px);
}

    .warning-modal {
    background: white;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    text-align: center;
    max-width: 500px;
    animation: slideIn 0.3s ease-out;
}

    @keyframes slideIn {
    from {
    opacity: 0;
    transform: translateY(-20px);
}
    to {
    opacity: 1;
    transform: translateY(0);
}
}

    .warning-icon {
    font-size: 64px;
    margin-bottom: 20px;
    animation: pulse 1.5s ease-in-out infinite;
}

    @keyframes pulse {
    0%, 100% {
    transform: scale(1);
}
    50% {
    transform: scale(1.1);
}
}

    h1 {
    color: #ef4444;
    font-size: 28px;
    margin-bottom: 16px;
}

    p {
    color: #6b7280;
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 24px;
}

    .timer {
    font-size: 48px;
    font-weight: 700;
    color: #2563eb;
    margin: 20px 0;
    font-variant-numeric: tabular-nums;
}

    .message {
    font-size: 14px;
    color: #9ca3af;
    margin-top: 16px;
}

    button {
    background-color: #2563eb;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s;
}

    button:hover {
    background-color: #1d4ed8;
}

    .progress-bar {
    width: 100%;
    height: 6px;
    background: #e5e7eb;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 24px;
}

    .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #ef4444, #dc2626);
    width: 100%;
    animation: progressReduce 6s linear forwards;
}

    @keyframes progressReduce {
    from {
    width: 100%;
}
    to {
    width: 0%;
}
}
</style>
</head>
<body>
<div class="warning-modal">
    <div class="warning-icon">⚠️</div>
    <h1>Stay Focused!</h1>
    <p>You've exceeded your tab limit. This tab will close automatically to help you maintain focus.</p>
    <div class="timer" id="countdown">6</div>
    <div class="message">This tab will close in <span id="seconds">6</span> seconds</div>
    <div class="progress-bar">
        <div class="progress-fill"></div>
    </div>
    <button id="keepTab" style="margin-top: 24px;">Keep This Tab</button>
</div>

<script src="warning.js"></script>
</body>
</html>
